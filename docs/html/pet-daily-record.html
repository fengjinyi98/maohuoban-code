<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛伙伴 - 添加日常记录 (Apple Health Style)</title>
    <style>
        /* ============================================================
           毛伙伴 UI Design Spec
           风格：Apple Health · Frosted Glass · 冷白蓝灰 · 低饱和
           设备：iPhone 14 Pro · 390 × 844pt · @3x
           ============================================================ */

        :root {
            /* — Brand — */
            --primary:     #4F8CFF;
            --primary-lt:  #6BCBFF;
            --primary-bg:  rgba(79,140,255,0.08);

            /* — Semantic — */
            --green:   #34C759;
            --orange:  #FF9500;
            --red:     #FF3B30;
            --teal:    #5AC8FA;
            --purple:  #AF52DE;

            /* — Neutral — */
            --bg:        #F7F9FC;
            --card:      rgba(255,255,255,0.75);
            --card-solid:#FFFFFF;
            --card-border:rgba(255,255,255,0.6);

            --l1: #1A1D26;     /* primary text */
            --l2: #6E7681;     /* secondary */
            --l3: #9CA3AF;     /* tertiary */
            --l4: #D1D5DB;     /* quaternary */

            --sep: rgba(0,0,0,0.05);

            /* — Radius — */
            --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-full:9999px;

            /* — Font — */
            --font: -apple-system, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;

            /* — Device — */
            --dw:390px; --dh:844px; --safe-t:59px; --safe-b:34px;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: var(--font);
            background: #E8EDF5; /* Desktop background */
            color: var(--l1);
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 0;
        }

        /* ===== iPhone 14 Pro ===== */
        .ip {
            width: var(--dw);
            height: var(--dh);
            background: var(--bg);
            border-radius: 55px;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 0 0 1px rgba(0,0,0,0.06),
                0 0 0 3px var(--bg),
                0 0 0 4px rgba(0,0,0,0.06),
                0 24px 80px rgba(0,0,0,0.1);
        }

        /* Background Orb (Subtle cold blue) */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(80px);
            opacity: 0.3;
        }

        .di {
            position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
            width: 126px; height: 37px; background: #000; border-radius: 20px; z-index: 100;
        }

        .stb {
            position: absolute; top: 0; left: 0; right: 0;
            height: var(--safe-t);
            display: flex; align-items: flex-end; justify-content: space-between;
            padding: 0 30px 10px;
            z-index: 50;
            font-size: 15px; font-weight: 600; color: var(--l1);
        }
        .stb-r { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
        .stb-r svg { width: 17px; height: 12px; }

        .hi {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            width: 134px; height: 5px; background: var(--l1); border-radius: 3px; z-index: 200; opacity: 0.15;
        }

        /* ===== Nav Bar (Frosted) ===== */
        .nav-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            padding-top: var(--safe-t);
            padding-bottom: 12px;
            background: rgba(247,249,252,0.8);
            backdrop-filter: blur(20px) saturate(1.6);
            -webkit-backdrop-filter: blur(20px) saturate(1.6);
            border-bottom: 0.5px solid rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 16px;
            padding-right: 16px;
            z-index: 90;
        }
        .nav-btn {
            color: var(--primary);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
        .nav-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--l1);
            letter-spacing: -0.2px;
        }

        /* ===== Scroll Content ===== */
        .sc {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            overflow-y: auto; overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-top: calc(var(--safe-t) + 44px + 16px);
            padding-bottom: calc(var(--safe-b) + 80px); /* Space for bottom button */
            padding-left: 16px;
            padding-right: 16px;
            z-index: 1;
        }
        .sc::-webkit-scrollbar { display: none; }

        /* ===== Shared iOS Clean Components ===== */
        .fc {
            background: var(--card);
            backdrop-filter: blur(20px) saturate(1.6);
            -webkit-backdrop-filter: blur(20px) saturate(1.6);
            border: 0.5px solid var(--card-border);
            border-radius: var(--r-lg);
            overflow: hidden;
            margin-bottom: 16px;
        }

        .sh {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 4px 8px;
            margin-top: 8px;
        }
        .sh-t {
            font-size: 13px; font-weight: 500; color: var(--l3);
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        /* Category Grid */
        .cat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px 8px;
            padding: 16px;
        }
        .cat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .cat-ic {
            width: 48px;
            height: 48px;
            border-radius: var(--r-full);
            background: rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            border: 0.5px solid var(--sep);
            transition: all 0.2s;
        }
        .cat-item.active .cat-ic {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(79,140,255,0.3);
        }
        .cat-item.active .cat-ic svg { stroke: #fff; }
        .cat-lb {
            font-size: 12px;
            color: var(--l2);
            font-weight: 500;
        }
        .cat-item.active .cat-lb {
            color: var(--primary);
            font-weight: 600;
        }
        /* Custom Icons for grid */
        .cat-ic svg { width: 24px; height: 24px; stroke: var(--l2); stroke-width: 1.5; fill: none; }

        /* iOS List inside card */
        .ir {
            display: flex; align-items: center; padding: 12px 16px; gap: 12px; position: relative;
        }
        .ir + .ir::before {
            content: ''; position: absolute; top: 0; left: 16px; right: 0;
            height: 0.5px; background: var(--sep);
        }
        .ir-bd { flex: 1; min-width: 0; font-size: 16px; color: var(--l1); }
        .ir-vl { font-size: 16px; color: var(--l2); flex-shrink: 0; }
        .ir-vl.active { color: var(--primary); }
        .chv { width: 8px; height: 13px; flex-shrink: 0; margin-left: 4px; }
        .chv svg { width: 8px; height: 13px; stroke: var(--l4); stroke-width: 2; fill: none; }

        /* Stepper inside list */
        .stepper {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .step-btn {
            width: 32px; height: 32px;
            border-radius: var(--r-full);
            background: rgba(0,0,0,0.05);
            display: flex; align-items: center; justify-content: center;
            color: var(--l1); font-size: 18px; font-weight: 500;
            cursor: pointer;
        }
        .step-btn:active { background: rgba(0,0,0,0.1); }
        .step-val {
            font-size: 17px; font-weight: 600; color: var(--l1); font-variant-numeric: tabular-nums;
            min-width: 44px; text-align: center;
        }

        /* Chips / Options */
        .chips-scroll {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .chips-scroll::-webkit-scrollbar { display: none; }
        .chip {
            padding: 6px 14px;
            background: rgba(0,0,0,0.04);
            border-radius: var(--r-full);
            font-size: 14px;
            color: var(--l2);
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            border: 0.5px solid transparent;
        }
        .chip.active {
            background: var(--primary-bg);
            color: var(--primary);
            border-color: rgba(79,140,255,0.3);
            font-weight: 600;
        }

        /* Textarea inside card */
        .ta {
            width: 100%;
            border: none;
            background: transparent;
            font-family: var(--font);
            font-size: 16px;
            color: var(--l1);
            padding: 16px;
            resize: none;
            height: 100px;
            outline: none;
        }
        .ta::placeholder { color: var(--l4); }

        /* Bottom Save Button Container */
        .btm-action {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 16px 20px calc(var(--safe-b) + 12px);
            background: linear-gradient(180deg, rgba(247,249,252,0) 0%, rgba(247,249,252,0.9) 30%, #F7F9FC 100%);
            z-index: 80;
        }
        .btn-primary {
            width: 100%;
            height: 50px;
            border-radius: var(--r-lg);
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.2px;
            box-shadow: 0 4px 14px rgba(79,140,255,0.3);
            border: none;
            cursor: pointer;
        }
        .btn-primary:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="ip">
    <!-- BG decoration for Apple Health vibe -->
    <div class="bg-orb" style="width:200px;height:200px;background:rgba(79,140,255,0.15);top:100px;right:-50px;"></div>
    <div class="bg-orb" style="width:180px;height:180px;background:rgba(107,203,255,0.12);top:400px;left:-60px;"></div>

    <div class="di"></div>
    <div class="stb">
        <span>9:41</span>
        <div class="stb-r">
            <svg viewBox="0 0 18 12"><path d="M1 5.5C3.5 2 6.5 0 9 0s5.5 2 8 5.5" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M3.5 8C5.3 6.2 7 5.2 9 5.2s3.7 1 5.5 2.8" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="9" cy="10.5" r="1.5" fill="currentColor"/></svg>
            <span>5G</span>
            <svg viewBox="0 0 28 12"><rect x="0.5" y="0.5" width="23" height="11" rx="2" stroke="currentColor" fill="none"/><rect x="2" y="2" width="18" height="8" rx="1" fill="currentColor"/><rect x="25" y="3.5" width="2" height="5" rx="1" fill="currentColor" opacity=".4"/></svg>
        </div>
    </div>

    <!-- Frosted Navigation Bar -->
    <div class="nav-bar">
        <div class="nav-btn">取消</div>
        <div class="nav-title">添加记录</div>
        <div class="nav-btn" style="color: transparent; pointer-events: none;">取消</div> <!-- placeholder -->
    </div>

    <div class="sc">
        
        <div class="sh"><span class="sh-t">记录类型</span></div>
        <div class="fc">
            <div class="cat-grid">
                <div class="cat-item active">
                    <div class="cat-ic" style="color: var(--orange);">
                        <!-- Food Icon -->
                        <svg viewBox="0 0 24 24" style="stroke: currentColor;"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
                    </div>
                    <span class="cat-lb">喂食</span>
                </div>
                <div class="cat-item">
                    <div class="cat-ic" style="color: var(--teal);">
                        <svg viewBox="0 0 24 24" style="stroke: currentColor;"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                    </div>
                    <span class="cat-lb">饮水</span>
                </div>
                <div class="cat-item">
                    <div class="cat-ic" style="color: var(--green);">
                        <!-- Walk Icon -->
                        <svg viewBox="0 0 24 24" style="stroke: currentColor;"><path d="M13 4v16"/><path d="M17 4v16"/><path d="M9 4v16"/></svg>
                    </div>
                    <span class="cat-lb">运动</span>
                </div>
                <div class="cat-item">
                    <div class="cat-ic" style="color: #A2845E;">
                        <!-- Poop Icon -->
                        <svg viewBox="0 0 24 24" style="stroke: currentColor;"><path d="M12 2v6"/><path d="M8 8v6"/><path d="M16 8v6"/><path d="M12 14v8"/></svg>
                    </div>
                    <span class="cat-lb">排便</span>
                </div>
                <div class="cat-item">
                    <div class="cat-ic" style="color: var(--red);">
                        <svg viewBox="0 0 24 24" style="stroke: currentColor;"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                    </div>
                    <span class="cat-lb">状态</span>
                </div>
                <div class="cat-item">
                    <div class="cat-ic" style="color: var(--purple);">
                        <svg viewBox="0 0 24 24" style="stroke: currentColor;"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/></svg>
                    </div>
                    <span class="cat-lb">体重</span>
                </div>
                <div class="cat-item">
                    <div class="cat-ic" style="color: var(--primary);">
                        <svg viewBox="0 0 24 24" style="stroke: currentColor;"><path d="M10.5 14.5c2.219 2.22 5.81 2.22 8.03 0l1.41-1.41a5.682 5.682 0 0 0-8.03-8.03l-1.41 1.41a5.682 5.682 0 0 0 0 8.03z"/><path d="M13.5 9.5c-2.219-2.22-5.81-2.22-8.03 0l-1.41 1.41a5.682 5.682 0 0 0 8.03 8.03l1.41-1.41a5.682 5.682 0 0 0 0-8.03z"/></svg>
                    </div>
                    <span class="cat-lb">用药</span>
                </div>
                <div class="cat-item">
                    <div class="cat-ic" style="color: var(--l3);">
                        <svg viewBox="0 0 24 24" style="stroke: currentColor;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                    </div>
                    <span class="cat-lb">其他</span>
                </div>
            </div>
        </div>

        <div class="sh"><span class="sh-t">详情</span></div>
        <div class="fc">
            <div class="ir">
                <div class="ir-bd">时间</div>
                <div class="ir-vl active">今天 09:41</div>
                <div class="chv"><svg viewBox="0 0 8 13"><polyline points="1 1 6 6.5 1 12"/></svg></div>
            </div>
            <div class="ir">
                <div class="ir-bd">喂食量</div>
                <div class="stepper">
                    <div class="step-btn">−</div>
                    <div class="step-val">80 g</div>
                    <div class="step-btn">+</div>
                </div>
            </div>
            <!-- Type selection inline -->
            <div class="chips-scroll">
                <div class="chip active">主食罐</div>
                <div class="chip">干粮</div>
                <div class="chip">冻干</div>
                <div class="chip">生骨肉</div>
                <div class="chip">零食</div>
            </div>
        </div>

        <div class="sh"><span class="sh-t">备注</span></div>
        <div class="fc">
            <textarea class="ta" placeholder="在此记录详细情况..."></textarea>
            <!-- Add Photo area inside the same card -->
            <div class="ir" style="border-top: 0.5px solid var(--sep);">
                <div class="ir-bd" style="color: var(--primary);">添加照片</div>
                <div class="chv"><svg viewBox="0 0 8 13"><polyline points="1 1 6 6.5 1 12"/></svg></div>
            </div>
        </div>

    </div>

    <!-- Bottom Save Action -->
    <div class="btm-action">
        <button class="btn-primary">保存记录</button>
    </div>

    <div class="hi"></div>
</div>

</body>
</html>
