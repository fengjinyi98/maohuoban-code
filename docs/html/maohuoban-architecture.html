<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>毛伙伴 Maohuoban — 工程架构图</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234F8CFF'/%3E%3Ccircle cx='11' cy='12' r='3' fill='white'/%3E%3Ccircle cx='21' cy='12' r='3' fill='white'/%3E%3Cpath d='M10 21c3 3 9 3 12 0' stroke='white' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<script>
  (function () {
    const saved = localStorage.getItem("maohuoban-architecture-theme");
    const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.classList.toggle("dark", dark);
  })();
</script>
<style>
  :root {
    --bg: #F7F9FC;
    --surface: rgba(255,255,255,0.84);
    --surface-solid: #FFFFFF;
    --surface-2: rgba(245,248,252,0.92);
    --ink: #1A1D26;
    --body: #4B5563;
    --muted: #7C8796;
    --line: rgba(26,29,38,0.12);
    --line-soft: rgba(26,29,38,0.07);
    --primary: #4F8CFF;
    --primary-2: #6BCBFF;
    --primary-soft: rgba(79,140,255,0.12);
    --green: #34C759;
    --green-soft: rgba(52,199,89,0.13);
    --orange: #FF9500;
    --orange-soft: rgba(255,149,0,0.14);
    --red: #FF3B30;
    --red-soft: rgba(255,59,48,0.12);
    --teal: #5AC8FA;
    --teal-soft: rgba(90,200,250,0.14);
    --purple: #AF52DE;
    --purple-soft: rgba(175,82,222,0.13);
    --zone: rgba(255,255,255,0.44);
    --zone-strong: rgba(255,255,255,0.68);
    --shadow: 0 18px 58px rgba(30,45,75,0.12);
    --font: -apple-system, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    --mono: "SF Mono", Menlo, Consolas, ui-monospace, monospace;
  }

  html.dark {
    --bg: #10141C;
    --surface: rgba(27,33,45,0.84);
    --surface-solid: #171D28;
    --surface-2: rgba(30,38,52,0.92);
    --ink: #F6F8FC;
    --body: #D4DAE5;
    --muted: #8E9AAD;
    --line: rgba(246,248,252,0.14);
    --line-soft: rgba(246,248,252,0.08);
    --primary: #75A6FF;
    --primary-2: #75D5FF;
    --primary-soft: rgba(117,166,255,0.18);
    --green: #55D977;
    --green-soft: rgba(85,217,119,0.16);
    --orange: #FFB14A;
    --orange-soft: rgba(255,177,74,0.16);
    --red: #FF6B63;
    --red-soft: rgba(255,107,99,0.16);
    --teal: #6ED4FF;
    --teal-soft: rgba(110,212,255,0.16);
    --purple: #C77AFF;
    --purple-soft: rgba(199,122,255,0.16);
    --zone: rgba(255,255,255,0.04);
    --zone-strong: rgba(255,255,255,0.07);
    --shadow: 0 22px 70px rgba(0,0,0,0.28);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 12%, var(--primary-soft), transparent 32%),
      radial-gradient(circle at 84% 8%, var(--teal-soft), transparent 28%),
      linear-gradient(180deg, var(--bg), var(--bg));
    color: var(--body);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .shell {
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line-soft);
    background: color-mix(in srgb, var(--surface-solid) 76%, transparent);
    backdrop-filter: blur(24px) saturate(1.5);
    -webkit-backdrop-filter: blur(24px) saturate(1.5);
  }

  .brand {
    min-width: 290px;
  }

  .brand h1 {
    color: var(--ink);
    font-size: 20px;
    line-height: 1.15;
    font-weight: 760;
    letter-spacing: 0;
  }

  .brand p {
    margin-top: 3px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .chips {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .chip,
  .theme-toggle {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    border-radius: 999px;
    height: 30px;
    padding: 0 12px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: transform .16s ease, color .16s ease, border-color .16s ease, background .16s ease;
  }

  .chip:hover,
  .theme-toggle:hover {
    color: var(--ink);
    border-color: var(--primary);
    transform: translateY(-1px);
  }

  .chip.on {
    color: var(--surface-solid);
    border-color: var(--primary);
    background: var(--primary);
  }

  .spacer { flex: 1; }

  .stage {
    position: relative;
    min-height: 0;
    overflow: hidden;
  }

  .stage svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .zone rect {
    fill: var(--zone);
    stroke: var(--line);
    stroke-width: 1.2;
    stroke-dasharray: 8 7;
    rx: 18;
  }

  .zone.core rect {
    fill: var(--zone-strong);
  }

  .zone-title {
    fill: var(--ink);
    font-size: 15px;
    font-weight: 760;
    letter-spacing: 0;
  }

  .zone-sub {
    fill: var(--muted);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.02em;
  }

  .node {
    cursor: pointer;
    transition: opacity .18s ease, filter .18s ease;
  }

  .node rect,
  .node path.panel {
    fill: var(--surface);
    stroke: var(--line);
    stroke-width: 1.35;
    rx: 12;
    filter: drop-shadow(0 8px 18px rgba(40,70,120,0.05));
    transition: stroke .18s ease, fill .18s ease, filter .18s ease;
  }

  html.dark .node rect,
  html.dark .node path.panel {
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.16));
  }

  .node:hover rect,
  .node:hover path.panel {
    stroke: var(--primary);
    filter: drop-shadow(0 14px 28px rgba(79,140,255,0.13));
  }

  .node.selected rect,
  .node.selected path.panel {
    stroke: var(--primary);
    stroke-width: 2.2;
  }

  .node .title {
    fill: var(--ink);
    font-size: 14.5px;
    font-weight: 720;
    letter-spacing: 0;
    pointer-events: none;
  }

  .node .sub {
    fill: var(--muted);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.01em;
    pointer-events: none;
  }

  .node .tag {
    fill: var(--primary);
    font-family: var(--mono);
    font-size: 9.6px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
  }

  .node.client rect { fill: var(--primary-soft); stroke: var(--primary); }
  .node.backend rect { fill: var(--teal-soft); stroke: var(--teal); }
  .node.domain rect { fill: var(--green-soft); stroke: var(--green); }
  .node.storage rect { fill: var(--surface-2); }
  .node.external rect { fill: var(--orange-soft); stroke: var(--orange); stroke-dasharray: 7 4; }
  .node.future rect { stroke-dasharray: 7 4; }
  .node.risk rect { fill: var(--red-soft); stroke: var(--red); }
  .node.obs rect { fill: var(--purple-soft); stroke: var(--purple); }

  .edge {
    stroke: var(--muted);
    stroke-width: 1.65;
    fill: none;
    marker-end: url(#arrow-muted);
    opacity: .74;
    transition: opacity .18s ease, stroke .18s ease;
  }

  .edge.soft {
    stroke-dasharray: 7 6;
    opacity: .54;
  }

  .edge.heavy {
    stroke-width: 2.2;
  }

  .edge-label {
    fill: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.01em;
    transition: opacity .18s ease, fill .18s ease;
  }

  .stage.flowing .edge,
  .stage.flowing .edge-label,
  .stage.flowing .node {
    opacity: .16;
  }

  .stage.flowing .zone {
    opacity: .38;
  }

  .stage.flowing .edge.lit {
    opacity: 1;
    stroke: var(--primary);
    marker-end: url(#arrow-primary);
    stroke-dasharray: 10 7;
    animation: march .9s linear infinite;
  }

  .stage.flowing .edge-label.lit {
    opacity: 1;
    fill: var(--primary);
  }

  .stage.flowing .node.lit {
    opacity: 1;
  }

  .stage.flowing .node.lit rect,
  .stage.flowing .node.lit path.panel {
    stroke: var(--primary);
    stroke-width: 2;
  }

  @keyframes march {
    to { stroke-dashoffset: -17; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage.flowing .edge.lit { animation: none; }
  }

  .legend {
    position: absolute;
    top: 16px;
    left: 18px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    max-width: 760px;
    pointer-events: none;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--line-soft);
    box-shadow: var(--shadow);
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: var(--primary);
  }

  .dot.green { background: var(--green); }
  .dot.orange { background: var(--orange); }
  .dot.purple { background: var(--purple); }

  .detail,
  .flowcard {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    backdrop-filter: blur(24px) saturate(1.5);
    -webkit-backdrop-filter: blur(24px) saturate(1.5);
    border-radius: 18px;
  }

  .detail {
    right: 18px;
    bottom: 18px;
    width: 380px;
    padding: 16px;
  }

  .detail h2 {
    color: var(--ink);
    font-size: 18px;
    line-height: 1.2;
    font-weight: 760;
    letter-spacing: 0;
  }

  .detail .meta {
    margin-top: 4px;
    color: var(--primary);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .detail p {
    margin-top: 10px;
    font-size: 13px;
    line-height: 1.62;
  }

  .detail code,
  .flowcard code {
    color: var(--primary);
    font-family: var(--mono);
    font-size: .92em;
  }

  .flowcard {
    left: 18px;
    bottom: 18px;
    width: 470px;
    padding: 14px 16px 16px;
    display: none;
  }

  .flowcard.show {
    display: block;
  }

  .flowcard .flow-name {
    color: var(--primary);
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 760;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .flowcard ol {
    margin-top: 8px;
    margin-left: 18px;
  }

  .flowcard li {
    padding: 2px 0;
    font-size: 12.6px;
    line-height: 1.55;
  }

  .source {
    position: absolute;
    right: 20px;
    top: 16px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    opacity: .78;
    pointer-events: none;
  }

  @media (max-width: 1080px) {
    body { overflow: auto; }
    .shell { min-height: 100vh; height: auto; }
    .topbar { align-items: flex-start; flex-direction: column; }
    .brand { min-width: 0; }
    .stage { min-height: 820px; overflow: auto; }
    .stage svg { min-width: 1320px; }
    .detail,
    .flowcard {
      position: static;
      width: auto;
      margin: 12px 18px;
    }
    .source { display: none; }
  }
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand">
      <h1>毛伙伴工程架构图</h1>
      <p>iOS · DesignSystem · Rust workspace · Diagnostics · Web HIS</p>
    </div>

      <button class="chip on" data-flow="all">总览</button>
      <button class="chip" data-flow="navigation-ui">导航/UI</button>

      <button class="chip" data-flow="home-profile">首页/档案</button>

  <section class="stage" id="stage">

  edges.forEach((edge) => edge.classList.remove("lit"));
  labels.forEach((label) => label.classList.remove("lit"));
  nodes.forEach((node) => node.classList.remove("lit"));

  if (key === "all") {
    stage.classList.remove("flowing");
    flowCard.classList.remove("show");
    return;
  }

  const flow = FLOWS[key];
  stage.classList.add("flowing");
  flow.edges.forEach((id) => document.getElementById(id)?.classList.add("lit"));
  flow.nodes.forEach((keyName) => document.querySelector(`.node[data-k="${keyName}"]`)?.classList.add("lit"));
  labels.forEach((label) => {
    if (flow.edges.includes(label.dataset.e)) label.classList.add("lit");
  });

  document.getElementById("flowName").textContent = flow.name;
  document.getElementById("flowSteps").innerHTML = flow.steps.map((step) => `<li>${step}</li>`).join("");
  flowCard.classList.add("show");
}

chips.forEach((chip) => {
  chip.addEventListener("click", () => setFlow(chip.dataset.flow));
});

nodes.forEach((node) => {
  node.addEventListener("click", () => {
    nodes.forEach((item) => item.classList.remove("selected"));
    node.classList.add("selected");
    const detail = DETAILS[node.dataset.k];
    if (!detail) return;
    document.getElementById("detailTitle").textContent = detail.title;
    document.getElementById("detailMeta").textContent = detail.meta;
    document.getElementById("detailBody").innerHTML = detail.body;
  });
});

document.getElementById("themeToggle").addEventListener("click", () => {
  const dark = !document.documentElement.classList.contains("dark");
  document.documentElement.classList.toggle("dark", dark);
  localStorage.setItem("maohuoban-architecture-theme", dark ? "dark" : "light");
});
</script>
</body>
</html>
