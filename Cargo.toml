[workspace]
members = [
    "maohuoban-rust",
    "maohuoban-rust/crates/maohuoban-auth-application",
    "maohuoban-rust/crates/maohuoban-auth-domain",
    "maohuoban-rust/crates/maohuoban-auth-http",
    "maohuoban-rust/crates/maohuoban-auth-infrastructure",
    "maohuoban-rust/crates/maohuoban-home-application",
    "maohuoban-rust/crates/maohuoban-home-domain",
    "maohuoban-rust/crates/maohuoban-home-http",
    "maohuoban-rust/crates/maohuoban-legal-application",
    "maohuoban-rust/crates/maohuoban-legal-domain",
    "maohuoban-rust/crates/maohuoban-legal-http",
    "maohuoban-rust/crates/maohuoban-legal-infrastructure",
    "maohuoban-rust/crates/maohuoban-pet-application",
    "maohuoban-rust/crates/maohuoban-pet-domain",
    "maohuoban-rust/crates/maohuoban-pet-http",
    "maohuoban-rust/crates/maohuoban-pet-infrastructure",
    "maohuoban-rust/crates/maohuoban-recommendation-application",
    "maohuoban-rust/crates/maohuoban-recommendation-domain",
    "maohuoban-rust/crates/maohuoban-recommendation-infrastructure",
    "maohuoban-rust/crates/maohuoban-samecity-application",
    "maohuoban-rust/crates/maohuoban-samecity-domain",
    "maohuoban-rust/crates/maohuoban-samecity-http",
    "maohuoban-rust/crates/maohuoban-samecity-infrastructure",
    "maohuoban-diagnostics-sdk/collector",
    "maohuoban-diagnostics-sdk/rust",
]
default-members = [
    "maohuoban-rust",
    "maohuoban-rust/crates/maohuoban-auth-application",
    "maohuoban-rust/crates/maohuoban-auth-domain",
    "maohuoban-rust/crates/maohuoban-auth-http",
    "maohuoban-rust/crates/maohuoban-auth-infrastructure",
    "maohuoban-rust/crates/maohuoban-home-application",
    "maohuoban-rust/crates/maohuoban-home-domain",
    "maohuoban-rust/crates/maohuoban-home-http",
    "maohuoban-rust/crates/maohuoban-legal-application",
    "maohuoban-rust/crates/maohuoban-legal-domain",
    "maohuoban-rust/crates/maohuoban-legal-http",
    "maohuoban-rust/crates/maohuoban-legal-infrastructure",
    "maohuoban-rust/crates/maohuoban-pet-application",
    "maohuoban-rust/crates/maohuoban-pet-domain",
    "maohuoban-rust/crates/maohuoban-pet-http",
    "maohuoban-rust/crates/maohuoban-pet-infrastructure",
    "maohuoban-rust/crates/maohuoban-recommendation-application",
    "maohuoban-rust/crates/maohuoban-recommendation-domain",
    "maohuoban-rust/crates/maohuoban-recommendation-infrastructure",
    "maohuoban-rust/crates/maohuoban-samecity-application",
    "maohuoban-rust/crates/maohuoban-samecity-domain",
    "maohuoban-rust/crates/maohuoban-samecity-http",
    "maohuoban-rust/crates/maohuoban-samecity-infrastructure",
    "maohuoban-diagnostics-sdk/collector",
    "maohuoban-diagnostics-sdk/rust",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
maohuoban-auth-application = { path = "maohuoban-rust/crates/maohuoban-auth-application" }
maohuoban-auth-domain = { path = "maohuoban-rust/crates/maohuoban-auth-domain" }
maohuoban-auth-http = { path = "maohuoban-rust/crates/maohuoban-auth-http" }
maohuoban-auth-infrastructure = { path = "maohuoban-rust/crates/maohuoban-auth-infrastructure" }
maohuoban-home-application = { path = "maohuoban-rust/crates/maohuoban-home-application" }
maohuoban-home-domain = { path = "maohuoban-rust/crates/maohuoban-home-domain" }
maohuoban-home-http = { path = "maohuoban-rust/crates/maohuoban-home-http" }
maohuoban-legal-application = { path = "maohuoban-rust/crates/maohuoban-legal-application" }
maohuoban-legal-domain = { path = "maohuoban-rust/crates/maohuoban-legal-domain" }
maohuoban-legal-http = { path = "maohuoban-rust/crates/maohuoban-legal-http" }
maohuoban-legal-infrastructure = { path = "maohuoban-rust/crates/maohuoban-legal-infrastructure" }
maohuoban-pet-application = { path = "maohuoban-rust/crates/maohuoban-pet-application" }
maohuoban-pet-domain = { path = "maohuoban-rust/crates/maohuoban-pet-domain" }
maohuoban-pet-http = { path = "maohuoban-rust/crates/maohuoban-pet-http" }
maohuoban-pet-infrastructure = { path = "maohuoban-rust/crates/maohuoban-pet-infrastructure" }
maohuoban-recommendation-application = { path = "maohuoban-rust/crates/maohuoban-recommendation-application" }
maohuoban-recommendation-domain = { path = "maohuoban-rust/crates/maohuoban-recommendation-domain" }
maohuoban-recommendation-infrastructure = { path = "maohuoban-rust/crates/maohuoban-recommendation-infrastructure" }
maohuoban-samecity-application = { path = "maohuoban-rust/crates/maohuoban-samecity-application" }
maohuoban-samecity-domain = { path = "maohuoban-rust/crates/maohuoban-samecity-domain" }
maohuoban-samecity-http = { path = "maohuoban-rust/crates/maohuoban-samecity-http" }
maohuoban-samecity-infrastructure = { path = "maohuoban-rust/crates/maohuoban-samecity-infrastructure" }
maohuoban_diagnostics = { path = "maohuoban-diagnostics-sdk/rust" }
redis = { version = "1.2.2", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.23.3", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
